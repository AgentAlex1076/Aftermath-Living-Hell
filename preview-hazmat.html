<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; background: #262a26; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { buildHazmat } from './src/models/hazmat.ts';
    import { PlayerAnimator } from './src/entities/PlayerAnimator.ts';

    const w = 1200, h = 750;
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(w, h);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#2d322c');

    const hemi = new THREE.HemisphereLight('#a3ada6', '#3b352b', 1.7);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight('#d2d8cb', 2.1);
    sun.position.set(-14, 28, 12);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: '#252924', roughness: 0.95 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const dummyPlayer = {
      actualVelocity: new THREE.Vector3(0, 0, 0),
      state: 'normal',
      sprinting: false,
      swinging: false,
      swingArmed: false,
      swingProgress: 0,
      dodgeProgress: 0,
      dodgeDir: new THREE.Vector3(0, 0, 1),
      kick: 0,
      alive: true,
    };

    // 1. Model 1: Front 3/4 Studio View (matching Reference Image 1)
    const m1 = buildHazmat();
    m1.position.set(-0.85, 0, 0);
    m1.rotation.y = 0.42;
    scene.add(m1);
    const anim1 = new PlayerAnimator(m1);
    anim1.update(0.016, dummyPlayer, 0.42);

    // 2. Model 2: In-Game Camera Angle View (matching user in-game screenshot)
    const m2 = buildHazmat();
    m2.position.set(0.85, 0, 0);
    scene.add(m2);
    const anim2 = new PlayerAnimator(m2);
    anim2.update(0.016, dummyPlayer, 0);

    const camera = new THREE.PerspectiveCamera(36, w / h, 0.1, 100);
    camera.position.set(0, 2.6, 4.4);
    camera.lookAt(0, 0.9, 0);

    setTimeout(() => {
      renderer.render(scene, camera);
      document.title = 'RENDERED_OK';
    }, 150);
  </script>
</body>
</html>
