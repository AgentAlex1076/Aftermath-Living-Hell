name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Publish site/ on main (branch-based Pages)
        run: |
          rm -rf site
          mkdir site
          cp -R dist/. site/
          touch site/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --staged --quiet; then
            echo "site/ unchanged"
          else
            git commit -m "Update GitHub Pages build in site/"
            git push
          fi
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
